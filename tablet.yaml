                        icon: >-
                          {{ 'mdi:account-alert' if
                          ['binary_sensor.doorbell_person_occupancy','binary_sensor.front_door_bell_person','binary_sensor.frontyard_person_occupancy','binary_sensor.front_view_person','binary_sensor.westyard_person_occupancy','binary_sensor.west_yard_person','binary_sensor.backyard_person_occupancy','binary_sensor.back_yard_person','binary_sensor.basement_person']
                          | select('is_state','on') | list | count > 0 else
                          'mdi:cctv' }}
                        icon_color: >-
                          {{ 'red' if
                          ['binary_sensor.doorbell_person_occupancy','binary_sensor.front_door_bell_person','binary_sensor.frontyard_person_occupancy','binary_sensor.front_view_person','binary_sensor.westyard_person_occupancy','binary_sensor.west_yard_person','binary_sensor.backyard_person_occupancy','binary_sensor.back_yard_person','binary_sensor.basement_person']
                          | select('is_state','on') | list | count > 0 else
                          'grey' }}
                        content: >-
                          {% set ns = namespace(l=[]) %} {% if
                          is_state('binary_sensor.doorbell_person_occupancy','on')
                          or
                          is_state('binary_sensor.front_door_bell_person','on')
                          %}{% set ns.l = ns.l + ['Front Door'] %}{% endif %} {%
                          if
                          is_state('binary_sensor.frontyard_person_occupancy','on')
                          or is_state('binary_sensor.front_view_person','on')
                          %}{% set ns.l = ns.l + ['Front Yard'] %}{% endif %} {%
                          if
                          is_state('binary_sensor.westyard_person_occupancy','on')
                          or is_state('binary_sensor.west_yard_person','on')
                          %}{% set ns.l = ns.l + ['West Yard'] %}{% endif %} {%
                          if
                          is_state('binary_sensor.backyard_person_occupancy','on')
                          or is_state('binary_sensor.back_yard_person','on')
                          %}{% set ns.l = ns.l + ['Back Yard'] %}{% endif %} {%
                          if is_state('binary_sensor.basement_person','on') %}{%
                          set ns.l = ns.l + ['Basement'] %}{% endif %} {{ 'No
                          Person' if ns.l | length == 0 else 'Person @ ' ~ (ns.l
                          | join(' & ')) }}
