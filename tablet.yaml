kiosk_mode:
  hide_header: '{{ is_state(''input_boolean.kiosk_mode_tablet'', ''on'') }}'
  hide_sidebar: '{{ is_state(''input_boolean.kiosk_mode_tablet'', ''on'') }}'
  hide_overflow: '{{ is_state(''input_boolean.kiosk_mode_tablet'', ''on'') }}'
views:
  - title: Home
    path: home
    icon: mdi:home
    type: custom:grid-layout
    badges: []
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: minmax(330px, 1.1fr) minmax(170px, 0.5fr) minmax(280px, 1fr)
          grid-template-rows: auto 1fr
          grid-template-areas: |
            "header  header  header"
            "rooms   status  media"
          grid-column-gap: 14px
          grid-row-gap: 2px
          padding: 6px
          mediaquery:
            '(max-width: 760px)':
              grid-template-columns: 100%
              grid-template-areas: |
                "header"
                "status"
                "rooms"
                "media"
        cards:
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: auto auto 1fr
              grid-template-areas: |
                "title weather security"
              grid-gap: 10px
              align-items: center
              mediaquery:
                '(max-width: 760px)':
                  grid-template-columns: auto 1fr
                  grid-template-areas: |
                    "title weather"
                    "security security"
            cards:
              - view_layout:
                  grid-area: title
                type: custom:mushroom-title-card
                title: Home
                subtitle: >-
                  {% set h = now().hour %}{{ 'Good Morning' if h < 12 else 'Good
                  Afternoon' if h < 18 else 'Good Evening' }}
                alignment: start
                card_mod:
                  style: >
                    ha-card { background: transparent !important; border: none
                    !important; box-shadow: none !important; padding: 0px 4px 0
                    !important; margin: 0 !important; height: 100% !important;
                    display: flex !important; flex-direction: column !important;
                    justify-content: center !important; }

                    .title { font-size: 24px !important; font-weight: 700
                    !important; line-height: 1.1 !important; }

                    .subtitle { font-size: 13px !important; color: #ffffff
                    !important; opacity: 1 !important; font-weight: 700
                    !important; letter-spacing: 1px !important; text-transform:
                    uppercase !important; line-height: 1.1 !important; }
              - view_layout:
                  grid-area: weather
                type: custom:mushroom-template-card
                primary: '{{ now().strftime(''%A, %B '') ~ now().day }}'
                secondary: >-
                  {% set t = state_attr('weather.forecast_home','temperature')
                  %} {{ t | round(0) }}°  ·  {{ states('weather.forecast_home')
                  | replace('-', ' ') | title }}
                icon: >-
                  {% set c = states('weather.forecast_home') %} {% set map =
                  {'sunny':'mdi:weather-sunny','clear-night':'mdi:weather-night',
                  'partlycloudy':'mdi:weather-partly-cloudy','cloudy':'mdi:weather-cloudy',
                  'rainy':'mdi:weather-rainy','pouring':'mdi:weather-pouring','snowy':'mdi:weather-snowy',
                  'fog':'mdi:weather-fog','windy':'mdi:weather-windy','lightning':'mdi:weather-lightning',
                  'lightning-rainy':'mdi:weather-lightning-rainy','hail':'mdi:weather-hail'}
                  %} {{ map.get(c, 'mdi:weather-partly-cloudy') }}
                layout: horizontal
                fill_container: false
                tap_action:
                  action: more-info
                entity: weather.forecast_home
                icon_color: accent
                card_mod:
                  style: >
                    ha-card { background: transparent !important; border: none
                    !important; box-shadow: none !important; padding: 0
                    !important; margin: 0 !important; height: 100% !important;
                    display: flex !important; align-items: center !important;
                    justify-content: flex-start !important; }
              - view_layout:
                  grid-area: security
                type: custom:mushroom-chips-card
                alignment: end
                chips:
                  - type: conditional
                    conditions:
                      - entity: input_boolean.vacation_mode
                        state: 'on'
                    chip:
                      type: template
                      entity: input_boolean.vacation_mode
                      icon: mdi:airplane
                      icon_color: blue
                      content: Vacation
                      tap_action:
                        action: more-info
                      hold_action:
                        action: toggle
                  - type: conditional
                    conditions:
                      - entity: input_boolean.guest_mode
                        state: 'on'
                    chip:
                      type: template
                      entity: input_boolean.guest_mode
                      icon: mdi:account-multiple
                      icon_color: purple
                      content: Guests
                      tap_action:
                        action: more-info
                      hold_action:
                        action: toggle
                  - type: conditional
                    conditions:
                      - entity: sensor.trash
                        state: Trash
                    chip:
                      type: template
                      entity: sensor.trash
                      icon: mdi:trash-can
                      icon_color: green
                      content: Trash Day
                      tap_action:
                        action: more-info
                  - type: conditional
                    conditions:
                      - entity: sensor.trash
                        state: Closing Soon
                    chip:
                      type: template
                      entity: sensor.trash
                      icon: mdi:clock-alert
                      icon_color: orange
                      content: Trash Soon
                      tap_action:
                        action: more-info
                  - type: conditional
                    conditions:
                      - entity: sensor.carvin_elvehplug
                        state: CONNECTED
                    chip:
                      type: template
                      entity: sensor.carvin_elvehplug
                      icon: mdi:ev-station
                      icon_color: >-
                        {{ 'green' if
                        is_state('binary_sensor.richards_mach_e_mach_e_home_charging','on')
                        else 'blue' }}
                      content: Plugged In
                      tap_action:
                        action: more-info
                  - type: template
                    entity: alarm_control_panel.alarmo
                    icon: >-
                      {% set s = states('alarm_control_panel.alarmo') %} {% if s
                      == 'disarmed' %}mdi:shield-off-outline{% elif s ==
                      'triggered' %}mdi:bell-ring{% elif s in
                      ['arming','pending'] %}mdi:shield-sync{% elif s ==
                      'armed_night' %}mdi:shield-moon{% elif s == 'armed_away'
                      %}mdi:shield-lock{% else %}mdi:shield-home{% endif %}
                    icon_color: >-
                      {% set s = states('alarm_control_panel.alarmo') %} {% if s
                      == 'disarmed' %}grey{% elif s == 'triggered' %}red{% elif
                      s in ['arming','pending'] %}orange{% else %}green{% endif
                      %}
                    content: >-
                      {% set s = states('alarm_control_panel.alarmo') %} {{
                      'Armed ' ~ (s[6:] | replace('_',' ') | title) if
                      s.startswith('armed_') else s | replace('_',' ') | title
                      }}
                    tap_action:
                      action: navigate
                      navigation_path: '#alarm'
                  - type: template
                    entity: lock.front_lock
                    icon: >-
                      {% if is_state('binary_sensor.front_door_cs_contact','on')
                      %}mdi:door-open{% elif
                      is_state('lock.front_lock','locked') %}mdi:lock{% else
                      %}mdi:lock-open-variant{% endif %}
                    icon_color: >-
                      {% if is_state('binary_sensor.front_door_cs_contact','on')
                      %}red{% elif is_state('lock.front_lock','locked')
                      %}green{% else %}orange{% endif %}
                    content: Front
                    tap_action:
                      action: navigate
                      navigation_path: '#front-door'
                    hold_action:
                      action: toggle
                  - type: template
                    entity: lock.back_door
                    icon: >-
                      {% if is_state('binary_sensor.back_door_cs_contact','on')
                      %}mdi:door-open{% elif is_state('lock.back_door','locked')
                      %}mdi:lock{% else %}mdi:lock-open-variant{% endif %}
                    icon_color: >-
                      {% if is_state('binary_sensor.back_door_cs_contact','on')
                      %}red{% elif is_state('lock.back_door','locked') %}green{%
                      else %}orange{% endif %}
                    content: Back
                    tap_action:
                      action: navigate
                      navigation_path: '#back-door'
                    hold_action:
                      action: toggle
                  - type: template
                    entity: todo.shopping_list
                    icon: mdi:cart-variant
                    icon_color: >-
                      {{ 'orange' if states('todo.shopping_list') | int(0) > 0
                      else 'grey' }}
                    content: '{{ states(''todo.shopping_list'') | int(0) }}'
                    tap_action:
                      action: navigate
                      navigation_path: '#shopping'
                  - type: template
                    icon: mdi:calendar
                    icon_color: accent
                    tap_action:
                      action: navigate
                      navigation_path: '#calendar'
                  - type: template
                    entity: input_boolean.guest_mode
                    icon: mdi:wifi
                    icon_color: >-
                      {{ 'green' if is_state('input_boolean.guest_mode','on')
                      else 'accent' }}
                    tap_action:
                      action: navigate
                      navigation_path: '#guestwifi'
                  - type: template
                    icon: mdi:microphone
                    icon_color: accent
                    tap_action:
                      action: assist
                      pipeline_id: preferred
                      start_listening: true
                  - type: template
                    entity: input_boolean.kiosk_mode_tablet
                    icon: mdi:fit-to-screen-outline
                    icon_color: >-
                      {{ 'blue' if
                      is_state('input_boolean.kiosk_mode_tablet','on') else
                      'grey' }}
                    tap_action:
                      action: toggle
                    hold_action:
                      action: more-info
                card_mod:
                  style: |
                    ha-card {
                      background: none;
                      box-shadow: none;
                      border: none;
                      --chip-background: rgba(255,255,255,0.07);
                      --chip-height: 40px;
                      --chip-border-radius: 14px;
                      --chip-font-size: 13px;
                      --chip-icon-size: 20px;
                      --chip-padding: 0 12px;
                      --chip-spacing: 8px;
                    }
            view_layout:
              grid-area: header
          - type: vertical-stack
            cards:
              - type: custom:layout-card
                layout_type: custom:grid-layout
                layout:
                  grid-template-columns: auto 1fr
                  grid-template-areas: |
                    "title status"
                  align-items: center
                  grid-gap: 6px
                  padding: 0
                  margin: 0
                cards:
                  - type: heading
                    heading: Bathroom
                    heading_style: subtitle
                    view_layout:
                      grid-area: title
                    tap_action:
                      action: perform-action
                      perform_action: homeassistant.turn_off
                      target:
                        entity_id:
                          - light.main_bathroom_lights
                          - switch.bathroom_light
                          - switch.bathroom_fan
                          - light.master_bathroom_lamp
                    card_mod:
                      style: >
                        ha-card { background: transparent !important; border:
                        none !important; box-shadow: none !important; }
                        .subtitle { font-size: 13px !important; color: #ffffff
                        !important; opacity: 1 !important; font-weight: 700
                        !important; letter-spacing: 1px !important;
                        text-transform: uppercase !important; }
                  - type: custom:mushroom-chips-card
                    alignment: end
                    view_layout:
                      grid-area: status
                    chips:
                      - type: template
                        entity: sensor.main_bathroom_th_humidity
                        icon: mdi:water-percent
                        icon_color: >-
                          {% set h = states('sensor.main_bathroom_th_humidity')
                          | float(0) %} {{ 'blue' if h >= 70 else 'grey' }}
                        content: >-
                          {{ states('sensor.main_bathroom_th_humidity') |
                          float(0) | round(0) | int }}%
                        tap_action:
                          action: more-info
                    card_mod:
                      style: |
                        ha-card {
                          background: none;
                          box-shadow: none;
                          border: none;
                          --chip-background: transparent;
                          --chip-box-shadow: none;
                          --chip-border-width: 0;
                          --chip-height: 28px;
                          --chip-padding: 0 4px;
                          --chip-font-size: 12px;
                          --chip-font-weight: 600;
                          --chip-icon-size: 16px;
                        }
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: button
                    name: Mirror
                    icon: mdi:wall-sconce
                    entity: light.main_bathroom_lights
                    show_name: true
                    show_icon: true
                    icon_height: 24px
                    tap_action:
                      action: toggle
                    hold_action:
                      action: navigate
                      navigation_path: '#light-bath-mirror'
                    card_mod:
                      style: >
                        {% set active =
                        is_state('light.main_bathroom_lights','on') %} ha-card {
                        border-radius: 14px; border: none; box-shadow: none;
                        padding: 10px 2px !important; font-size: 12px;
                        --paper-item-icon-color: {{ '#26A69A' if active else
                        'var(--secondary-text-color)' }}; }
                  - type: button
                    name: Ceiling
                    icon: mdi:light-recessed
                    entity: switch.bathroom_light
                    show_name: true
                    show_icon: true
                    icon_height: 24px
                    tap_action:
                      action: toggle
                    hold_action:
                      action: more-info
                    card_mod:
                      style: >
                        {% set active = is_state('switch.bathroom_light','on')
                        %} ha-card { border-radius: 14px; border: none;
                        box-shadow: none; padding: 10px 2px !important;
                        font-size: 12px; --paper-item-icon-color: {{ '#26A69A'
                        if active else 'var(--secondary-text-color)' }}; }
                  - type: button
                    name: Exhaust
                    icon: mdi:fan
                    entity: switch.bathroom_fan
                    show_name: true
                    show_icon: true
                    icon_height: 24px
                    tap_action:
                      action: toggle
                    hold_action:
                      action: more-info
                    card_mod:
                      style: >
                        {% set active = is_state('switch.bathroom_fan','on') %}
                        ha-card { border-radius: 14px; border: none; box-shadow:
                        none; padding: 10px 2px !important; font-size: 12px;
                        --paper-item-icon-color: {{ '#26A69A' if active else
                        'var(--secondary-text-color)' }}; }
                  - type: button
                    name: Lamp
                    icon: mdi:lamp
                    entity: light.master_bathroom_lamp
                    show_name: true
                    show_icon: true
                    icon_height: 24px
                    tap_action:
                      action: toggle
                    hold_action:
                      action: navigate
                      navigation_path: '#light-bath-lamp'
                    card_mod:
                      style: >
                        {% set active =
                        is_state('light.master_bathroom_lamp','on') %} ha-card {
                        border-radius: 14px; border: none; box-shadow: none;
                        padding: 10px 2px !important; font-size: 12px;
                        --paper-item-icon-color: {{ '#26A69A' if active else
                        'var(--secondary-text-color)' }}; }
              - type: heading
                heading: Climate & Home
                heading_style: subtitle
                card_mod:
                  style: >
                    ha-card { background: transparent !important; border: none
                    !important; box-shadow: none !important; } .subtitle {
                    font-size: 13px !important; color: #ffffff !important;
                    opacity: 1 !important; font-weight: 700 !important;
                    letter-spacing: 1px !important; text-transform: uppercase
                    !important; }
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: custom:mushroom-template-card
                    entity: climate.master_bedroom
                    primary: Upstairs
                    secondary: >-
                      {% set cur =
                      state_attr('climate.master_bedroom','current_temperature')
                      | float(0) | round(0) | int %} {% set t =
                      state_attr('climate.master_bedroom','temperature') %} {{
                      cur }}°{% if t is not none %} → {{ t | float(0) | round(0)
                      | int }}°{% endif %}
                    icon: >-
                      {% set a =
                      (state_attr('climate.master_bedroom','hvac_action') or
                      states('climate.master_bedroom')) %} {% if a == 'heating'
                      %}mdi:fire{% elif a == 'cooling' %}mdi:snowflake{% elif a
                      == 'fan' %}mdi:fan{% else %}mdi:thermostat{% endif %}
                    icon_color: >-
                      {% set a =
                      (state_attr('climate.master_bedroom','hvac_action') or
                      states('climate.master_bedroom')) %} {% if a == 'heating'
                      %}deep-orange{% elif a == 'cooling' %}blue{% elif a ==
                      'fan' %}teal{% else %}grey{% endif %}
                    layout: vertical
                    multiline_secondary: true
                    tap_action:
                      action: navigate
                      navigation_path: '#climate-upstairs'
                    card_mod:
                      style: >
                        ha-card { border-radius: 14px; box-shadow: none;
                        padding: 10px 4px !important;
                          --card-primary-font-size: 13px; --card-secondary-font-size: 11px;
                          --icon-size: 38px; text-align: center; }
                  - type: custom:mushroom-template-card
                    entity: climate.my_ecobee
                    primary: Downstairs
                    secondary: >-
                      {% set cur =
                      state_attr('climate.my_ecobee','current_temperature') |
                      float(0) | round(0) | int %} {% set t =
                      state_attr('climate.my_ecobee','temperature') %} {{ cur
                      }}°{% if t is not none %} → {{ t | float(0) | round(0) |
                      int }}°{% endif %}
                    icon: >-
                      {% set a = (state_attr('climate.my_ecobee','hvac_action')
                      or states('climate.my_ecobee')) %} {% if a == 'heating'
                      %}mdi:fire{% elif a == 'cooling' %}mdi:snowflake{% elif a
                      == 'fan' %}mdi:fan{% else %}mdi:thermostat{% endif %}
                    icon_color: >-
                      {% set a = (state_attr('climate.my_ecobee','hvac_action')
                      or states('climate.my_ecobee')) %} {% if a == 'heating'
                      %}deep-orange{% elif a == 'cooling' %}blue{% elif a ==
                      'fan' %}teal{% else %}grey{% endif %}
                    layout: vertical
                    multiline_secondary: true
                    tap_action:
                      action: navigate
                      navigation_path: '#climate-downstairs'
                    card_mod:
                      style: >
                        ha-card { border-radius: 14px; box-shadow: none;
                        padding: 10px 4px !important;
                          --card-primary-font-size: 13px; --card-secondary-font-size: 11px;
                          --icon-size: 38px; text-align: center; }
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: custom:mushroom-template-card
                    primary: Safety
                    secondary: >-
                      {% set l =
                      ['binary_sensor.basement_water_leak_water_leak','binary_sensor.kitchen_sink_water_leak_water_leak','binary_sensor.klippbok_water_leak_sensor_water_leak_2','binary_sensor.main_bathroom_sink_water_leak_water_leak','binary_sensor.klippbok_water_leak_sensor_water_leak_3','binary_sensor.top_floor_bathroom_sink_water_leak_water_leak','binary_sensor.klippbok_water_leak_sensor_water_leak']
                      | select('is_state','on') | list | count %} {% set s =
                      ['binary_sensor.basement_floor_smoke','binary_sensor.kitchen_alarm_smoke','binary_sensor.top_floor_hallway_smoke']
                      | select('is_state','on') | list | count %} {% if s > 0
                      %}Smoke!{% elif l > 0 %}{{ l }} leak{{ 's' if l > 1 }}!{%
                      else %}All clear{% endif %}
                    icon: >-
                      {% set l =
                      ['binary_sensor.basement_water_leak_water_leak','binary_sensor.kitchen_sink_water_leak_water_leak','binary_sensor.klippbok_water_leak_sensor_water_leak_2','binary_sensor.main_bathroom_sink_water_leak_water_leak','binary_sensor.klippbok_water_leak_sensor_water_leak_3','binary_sensor.top_floor_bathroom_sink_water_leak_water_leak','binary_sensor.klippbok_water_leak_sensor_water_leak']
                      | select('is_state','on') | list | count %} {% set s =
                      ['binary_sensor.basement_floor_smoke','binary_sensor.kitchen_alarm_smoke','binary_sensor.top_floor_hallway_smoke']
                      | select('is_state','on') | list | count %} {% if s > 0
                      %}mdi:smoke-detector-alert{% elif l > 0
                      %}mdi:water-alert{% else %}mdi:shield-check{% endif %}
                    icon_color: >-
                      {% set l =
                      ['binary_sensor.basement_water_leak_water_leak','binary_sensor.kitchen_sink_water_leak_water_leak','binary_sensor.klippbok_water_leak_sensor_water_leak_2','binary_sensor.main_bathroom_sink_water_leak_water_leak','binary_sensor.klippbok_water_leak_sensor_water_leak_3','binary_sensor.top_floor_bathroom_sink_water_leak_water_leak','binary_sensor.klippbok_water_leak_sensor_water_leak']
                      | select('is_state','on') | list | count %} {% set s =
                      ['binary_sensor.basement_floor_smoke','binary_sensor.kitchen_alarm_smoke','binary_sensor.top_floor_hallway_smoke']
                      | select('is_state','on') | list | count %} {{ 'red' if (l
                      + s) > 0 else 'green' }}
                    layout: vertical
                    multiline_secondary: true
                    tap_action:
                      action: navigate
                      navigation_path: '#safety'
                    card_mod:
                      style: >
                        ha-card { border-radius: 14px; box-shadow: none;
                        padding: 10px 4px !important;
                          --card-primary-font-size: 13px; --card-secondary-font-size: 11px;
                          --icon-size: 38px; text-align: center; }
                  - type: custom:mushroom-template-card
                    entity: sensor.carvin_elveh
                    primary: Pony
                    secondary: >-
                      {{ states('sensor.carvin_elveh') |
                      float(0) | round(0) | int }} mi · {{
                      states('sensor.carvin_soc') | int(0)
                      }}%{{ ' ⚡' if
                      is_state('binary_sensor.richards_mach_e_mach_e_home_charging','on')
                      }}
                    icon: >-
                      {{ 'mdi:ev-station' if
                      is_state('binary_sensor.richards_mach_e_mach_e_home_charging','on')
                      else 'mdi:car-electric' }}
                    icon_color: >-
                      {% set r =
                      states('sensor.carvin_elveh') |
                      float(0) | round(0) | int %} {% if
                      is_state('binary_sensor.richards_mach_e_mach_e_home_charging','on')
                      %}green{% elif r >= 100 %}teal{% elif r >= 40 %}amber{%
                      else %}red{% endif %}
                    layout: vertical
                    multiline_secondary: true
                    tap_action:
                      action: navigate
                      navigation_path: '#pony'
                    card_mod:
                      style: >
                        ha-card { border-radius: 14px; box-shadow: none;
                        padding: 10px 4px !important;
                          --card-primary-font-size: 13px; --card-secondary-font-size: 11px;
                          --icon-size: 38px; text-align: center; }
              - type: custom:mushroom-template-card
                entity: light.all_lights
                primary: Lights
                secondary: >-
                  {% set n = states('sensor.lights_on_counter') | int(0) %} {{
                  'All off' if n == 0 else n ~ ' on' }}
                icon: mdi:lightbulb-group
                icon_color: >-
                  {{ 'amber' if states('sensor.lights_on_counter') | int(0) > 0
                  else 'grey' }}
                layout: horizontal
                fill_container: true
                tap_action:
                  action: more-info
                hold_action:
                  action: perform-action
                  perform_action: light.turn_off
                  target:
                    entity_id: light.all_lights
                card_mod:
                  style: |
                    ha-card { border-radius: 14px; box-shadow: none;
                      --card-primary-font-size: 13px; --card-secondary-font-size: 11px; }
              - type: custom:mushroom-template-card
                entity: vacuum.mowgli
                primary: Vacuum
                secondary: '{{ states(''vacuum.mowgli'') | replace(''_'','' '') | title }}'
                icon: mdi:robot-vacuum
                icon_color: >-
                  {% set s = states('vacuum.mowgli') %} {% if s == 'cleaning'
                  %}green{% elif s == 'returning' %}blue{% elif s == 'error'
                  %}red{% else %}grey{% endif %}
                layout: horizontal
                fill_container: true
                tap_action:
                  action: navigate
                  navigation_path: '#cleaning'
                card_mod:
                  style: |
                    ha-card { border-radius: 14px; box-shadow: none;
                      --card-primary-font-size: 13px; --card-secondary-font-size: 11px; }
              - type: custom:mushroom-template-card
                primary: Outdoor
                secondary: >-
                  {% set n =
                  ['light.front_porch','light.patio','light.front_view_floodlight','light.west_yard_floodlight','light.back_yard_floodlight']
                  | select('is_state','on') | list | count %} {{ 'All off' if n
                  == 0 else n ~ ' on' }}
                icon: mdi:outdoor-lamp
                icon_color: >-
                  {{ 'amber' if
                  ['light.front_porch','light.patio','light.front_view_floodlight','light.west_yard_floodlight','light.back_yard_floodlight']
                  | select('is_state','on') | list | count > 0 else 'grey' }}
                layout: horizontal
